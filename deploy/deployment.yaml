apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-oci-generator
  labels:
    app.kubernetes.io/name: argocd-oci-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-oci-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-oci-generator
    spec:
      containers:
        - name: generator
          image: ghcr.io/pelotech/argocd-oci-generator:0.1.0 # x-release-please-version
          envFrom:
            - secretRef:
                name: argocd-oci-generator
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
