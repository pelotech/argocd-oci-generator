# The generator's environment, read with envFrom. REGISTRY is the default host/prefix the set's repositories
# are relative to; CREDENTIALS_FILE replaces REGISTRY_USER and REGISTRY_PASSWORD when several registries are read.
apiVersion: v1
kind: Secret
metadata:
  name: argocd-oci-generator
type: Opaque
stringData:
  REGISTRY: registry.example.com/example/apps
  REGISTRY_USER: REPLACE_WITH_A_READ_ONLY_USER
  REGISTRY_PASSWORD: REPLACE_WITH_ITS_PASSWORD
  PLUGIN_TOKEN: REPLACE_WITH_A_RANDOM_SECRET
---
# The same plugin token, where Argo CD reads it: a Secret labeled for Argo CD, referenced by the plugin ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: argocd-oci-generator-plugin
  labels:
    app.kubernetes.io/part-of: argocd
type: Opaque
stringData:
  token: REPLACE_WITH_THE_SAME_RANDOM_SECRET
---
# Only for a registry with a private CA.
apiVersion: v1
kind: Secret
metadata:
  name: argocd-oci-generator-ca
type: Opaque
stringData:
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_THE_REGISTRY_CA_PEM
    -----END CERTIFICATE-----
