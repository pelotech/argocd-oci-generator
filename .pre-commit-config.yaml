# Runs with prek or pre-commit; CI runs the same hooks.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: forbid-submodules
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict, -c=.yamllint]
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        language: system
        entry: sh -c 'test -z "$(gofmt -l "$@")" || { gofmt -l "$@"; exit 1; }' --
        files: \.go$
      - id: go-vet
        name: go vet
        language: system
        entry: go vet ./...
        pass_filenames: false
        files: \.go$|go\.(mod|sum)$
      - id: go-mod-tidy
        name: go mod tidy
        language: system
        entry: go mod tidy -diff
        pass_filenames: false
        files: \.go$|go\.(mod|sum)$
      - id: bash-syntax
        name: bash -n
        language: system
        entry: bash -n
        files: \.sh$
