# An authenticated TLS registry: distribution with htpasswd, its certificate and users from the registry-tls
# and registry-auth Secrets the test creates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          # The AWS mirror of the Docker Hub library, as Argo CD's own manifests use; no Docker Hub pull limits.
          image: public.ecr.aws/docker/library/registry:3.0.0
          env:
            - name: REGISTRY_AUTH
              value: htpasswd
            - name: REGISTRY_AUTH_HTPASSWD_REALM
              value: registry
            - name: REGISTRY_AUTH_HTPASSWD_PATH
              value: /auth/htpasswd
            - name: REGISTRY_HTTP_TLS_CERTIFICATE
              value: /tls/tls.crt
            - name: REGISTRY_HTTP_TLS_KEY
              value: /tls/tls.key
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: auth
              mountPath: /auth
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: registry-tls
        - name: auth
          secret:
            secretName: registry-auth
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
spec:
  selector:
    app: registry
  ports:
    - port: 443
      targetPort: 5000
